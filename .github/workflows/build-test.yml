name: Windows build, test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Debug native and managed regression
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Debug
      - name: Release tests, package and extracted-runtime audit
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload source, runtime and checksums
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: manhunt2-tex-editor-windows-x64
          path: |
            out/release/*.zip
            out/release/*.sha256
